name: Java CI

# Reusable: Gradle build (compile + tests) of a Java project and, optionally,
# the SonarQube Cloud analysis through the org.sonarqube Gradle plugin, which
# the project configures (projectKey fikua_<repo>, organization fikua, JaCoCo
# XML report path).
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      distribution:
        type: string
        default: temurin
      working-directory:
        description: Directory with the Gradle wrapper.
        type: string
        default: .
      gradle-tasks:
        description: Gradle tasks to run (before `sonar` when enabled).
        type: string
        default: build
      sonar:
        description: Run the `sonar` Gradle task after the build (needs SONAR_TOKEN).
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  gradle:
    # Fixed name: branch protection requires it as "<caller job> / gradle".
    name: gradle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout (full history when Sonar runs, for new-code detection)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: ${{ inputs.sonar && 0 || 1 }}

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0

      - name: Cache SonarQube packages
        if: inputs.sonar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
          SONAR_TASK: ${{ inputs.sonar && 'sonar' || '' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # GRADLE_TASKS is a space-separated list of task names.
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS $SONAR_TASK"
          ./gradlew --no-daemon "${tasks[@]}"
