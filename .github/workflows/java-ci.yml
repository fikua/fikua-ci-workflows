name: Java CI

# Reusable: Gradle build (compile + tests) of a Java project and, optionally,
# the SonarQube Cloud analysis through the org.sonarqube Gradle plugin, which
# the project configures (projectKey fikua_<repo>, organization fikua, JaCoCo
# XML report path).
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      distribution:
        type: string
        default: temurin
      working-directory:
        description: Directory with the Gradle wrapper.
        type: string
        default: .
      gradle-tasks:
        description: Gradle tasks to run (before `sonar` when enabled).
        type: string
        default: build
      sonar:
        description: Run the `sonar` Gradle task after the build (needs SONAR_TOKEN).
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  gradle:
    # Fixed name: branch protection requires it as "<caller job> / gradle".
    name: gradle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout (full history when Sonar runs, for new-code detection)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ inputs.sonar && 0 || 1 }}

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Cache SonarQube packages
        if: inputs.sonar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
          SONAR_TASK: ${{ inputs.sonar && 'sonar' || '' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # GRADLE_TASKS is a space-separated list of task names.
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS $SONAR_TASK"
          ./gradlew --no-daemon "${tasks[@]}"
